<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLine console</title>
<meta name="robots" content="noindex, nofollow">
<!-- Staff URLs carry trace codes too, and a console is exactly where a screen gets
     shared. Same policy as the public surface, for the same reason. -->
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#16191a">
<link rel="stylesheet" href="/assets/base.css">
<link rel="stylesheet" href="/assets/ops.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2316191a'/%3E%3Cg stroke='%23e2624f' stroke-width='2'%3E%3Cpath d='M5 5v14M10 5v14M15 5v14M3 18L20 6'/%3E%3C/g%3E%3C/svg%3E">
</head>
<!-- .ops is on the element itself, not added by script: the carbon surface must
     never flash paper-white while a module loads. -->
<body class="ops">

<a class="skip" href="#view">Skip to content</a>

<div id="app">
  <div class="shell shell-narrow" style="padding-block: 96px">
    <div class="load" aria-hidden="true"><i></i><i></i><i></i></div>
    <p class="sr">Loading the TrustLine console.</p>
  </div>
</div>

<noscript>
  <div class="shell shell-narrow" style="padding-block: 52px">
    <h1>The console needs JavaScript</h1>
    <p>Reports are identified by trace codes, which this console keeps out of every
      URL by handling them in the browser. Turn JavaScript on for this page and reload.</p>
    <p class="t-sm quiet"><a href="/">Back to the public site</a></p>
  </div>
</noscript>

<script type="module" src="/assets/ops.js"></script>
</body>
</html>
